<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NERÓS</title>

<style>

body{
margin:0;
padding:30px;
background:#0d0d0d;
font-family:Arial,Helvetica,sans-serif;
color:white;
}

h1{
text-align:center;
margin-bottom:30px;
}

input{
width:100%;
padding:15px;
font-size:18px;
border-radius:10px;
border:none;
margin-bottom:30px;
box-sizing:border-box;
}

#productos{

display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;

}

.card{

background:#1b1b1b;
border-radius:18px;
overflow:hidden;
box-shadow:0 0 15px rgba(0,0,0,.4);

}

.card img{

width:100%;
height:260px;
object-fit:cover;
background:#222;

}

.info{

padding:15px;

}

.nombre{

font-size:18px;
font-weight:bold;

}

.precio{

margin-top:10px;
font-size:22px;
color:#ffcc66;

}

.stock{

margin-top:10px;
font-size:14px;

}

.whatsapp{

display:block;
margin-top:15px;
text-align:center;
background:#25D366;
color:white;
padding:12px;
text-decoration:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>

<body>

<h1>NERÓS</h1>

<input
id="buscar"
placeholder="Buscar perfume...">

<div id="productos"></div>

<script>

const API="https://script.google.com/macros/s/AKfycbwuMOgpsxiDOrk14N85W25JCYiRmQJQRV5bz3i6YNSSQK72yQ5TU0hCIZIpUxCQvbeneg/exec";

let perfumes=[];

fetch(API)

.then(r=>r.json())

.then(data=>{

perfumes=data;

mostrar(data);

});

function mostrar(lista){

const cont=document.getElementById("productos");

cont.innerHTML="";

lista.forEach(p=>{

cont.innerHTML+=`

<div class="card">

<img src="${p.foto || 'https://placehold.co/400x500?text=NEROS'}">

<div class="info">

<div class="nombre">

${p.perfume}

</div>

<div class="precio">

$ ${Number(p.precio).toLocaleString("es-AR")}

</div>

<div class="stock">

${p.stock}

</div>

<a class="whatsapp"

target="_blank"

href="https://wa.me/5493410000000?text=Hola%20quiero%20consultar%20por%20${encodeURIComponent(p.perfume)}">

Consultar

</a>

</div>

</div>

`;

});

}

document.getElementById("buscar")

.addEventListener("keyup",e=>{

const t=e.target.value.toLowerCase();

mostrar(

perfumes.filter(p=>

p.perfume.toLowerCase().includes(t)

)

);

});

</script>

</body>

</html>
