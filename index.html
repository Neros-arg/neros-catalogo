<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NERÓS | Catálogo Oficial</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:
linear-gradient(rgba(8,8,8,.82),rgba(8,8,8,.82)),
url("fondo.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
color:white;
padding:30px;
}

.header{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
margin-bottom:35px;
}

.logo{
width:180px;
height:auto;
display:block;
}

.subtitulo{
margin-top:10px;
color:#c89d38;
font-size:13px;
letter-spacing:4px;
font-weight:bold;
text-transform:uppercase;
}

input{
width:100%;
max-width:700px;
margin:0 auto 35px;
display:block;
padding:16px;
background:#181818;
color:white;
border:1px solid #333;
border-radius:12px;
font-size:16px;
outline:none;
}

input:focus{
border-color:#c89d38;
}

#productos{
display:grid;
grid-template-columns:repeat(6,minmax(0,1fr));
gap:18px;
max-width:1800px;
margin:0 auto;
}

.card{
background:#171717;
border-radius:18px;
overflow:hidden;
border:1px solid #262626;
transition:.25s;
min-width:0;
}

.card:hover{
transform:translateY(-6px);
border-color:#c89d38;
}

.card img{
width:100%;
height:270px;
object-fit:cover;
background:#222;
display:block;
}

.info{
padding:15px;
}

.nombre{
font-size:16px;
font-weight:bold;
line-height:1.35;
min-height:65px;
overflow-wrap:anywhere;
}

.precio{
margin-top:12px;
font-size:25px;
font-weight:bold;
color:#ffcc66;
}

.stock{
margin-top:12px;
font-size:14px;
font-weight:bold;
min-height:20px;
}

.stock.disponible{
color:#3ddc84;
}

.stock.apedido{
color:#f5c542;
}

.stock.sinstock{
color:#ff5a5a;
}

.whatsapp{
display:block;
margin-top:16px;
padding:12px 8px;
background:#25D366;
border-radius:10px;
text-align:center;
text-decoration:none;
color:white;
font-size:14px;
font-weight:bold;
transition:.2s;
}

.whatsapp:hover{
background:#1fb85a;
}

@media(max-width:1450px){

#productos{
grid-template-columns:repeat(5,minmax(0,1fr));
}

}

@media(max-width:1150px){

#productos{
grid-template-columns:repeat(4,minmax(0,1fr));
}

}

@media(max-width:900px){

#productos{
grid-template-columns:repeat(3,minmax(0,1fr));
gap:14px;
}

.card img{
height:250px;
}

}

@media(max-width:600px){

body{
padding:10px;
}

.header{
margin-bottom:22px;
}

.logo{
width:145px;
}

.subtitulo{
font-size:11px;
letter-spacing:3px;
}

input{
margin-bottom:22px;
padding:13px;
font-size:14px;
}

#productos{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.card{
border-radius:12px;
}

.card:hover{
transform:none;
}

.card img{
height:190px;
}

.info{
padding:10px;
}

.nombre{
font-size:13px;
line-height:1.3;
min-height:52px;
}

.precio{
margin-top:8px;
font-size:20px;
}

.stock{
margin-top:8px;
font-size:12px;
min-height:30px;
}

.whatsapp{
margin-top:10px;
padding:10px 5px;
font-size:11px;
}

}

@media(max-width:360px){

body{
padding:7px;
}

#productos{
gap:7px;
}

.card img{
height:165px;
}

.info{
padding:8px;
}

.nombre{
font-size:12px;
min-height:48px;
}

.precio{
font-size:18px;
}

.stock{
font-size:11px;
}

.whatsapp{
font-size:10px;
}

}

</style>

</head>

<body>

<div class="header">

<img src="logo%20neros.png" class="logo" alt="NERÓS">

<div class="subtitulo">
CATÁLOGO OFICIAL
</div>

</div>

<input
id="buscar"
placeholder="🔍 Buscar perfume...">

<div id="productos"></div>

<script>

const API="https://script.google.com/macros/s/AKfycbwuMOgpsxiDOrk14N85W25JCYiRmQJQRV5bz3i6YNSSQK72yQ5TU0hCIZIpUxCQvbeneg/exec";

let perfumes=[];

fetch(API)

.then(r=>r.json())

.then(data=>{

perfumes=data;

mostrar(data);

});

function mostrar(lista){

const cont=document.getElementById("productos");

cont.innerHTML="";

lista.forEach(p=>{

let claseStock="";

let textoStock=(p.stock || "").toString().toLowerCase();

if(textoStock.includes("disponible")){

claseStock="disponible";

}else if(textoStock.includes("pedido")){

claseStock="apedido";

}else{

claseStock="sinstock";

}

const precioLista=Number(p.precio) || 0;

const precioEfectivo=precioLista*0.90;

const precioListaFormateado=precioLista.toLocaleString("es-AR",{
minimumFractionDigits:0,
maximumFractionDigits:0
});

const precioEfectivoFormateado=precioEfectivo.toLocaleString("es-AR",{
minimumFractionDigits:0,
maximumFractionDigits:0
});const mensajeWhatsApp=`Hola NERÓS 👋✨

Quiero consultar por este perfume:

🧴 ${p.perfume}

💳 Precio de lista: $${precioListaFormateado}

💵 Efectivo o transferencia:
$${precioEfectivoFormateado}

🏷️ 10% de descuento

📦 Estado: ${p.stock}

¿Me confirmás disponibilidad? Muchas gracias 🙌`;

cont.innerHTML+=`

<div class="card">

<img
src="${p.foto || 'https://placehold.co/600x800/222222/888888?text=NERÓS'}"
alt="${p.perfume || 'Perfume NERÓS'}"
loading="lazy">

<div class="info">

<div class="nombre">
${p.perfume}
</div>

<div class="precio">
$ ${precioListaFormateado}
</div>

<div class="stock ${claseStock}">
${p.stock}
</div>

<a
class="whatsapp"
target="_blank"
rel="noopener noreferrer"
href="https://wa.me/5493417830300?text=${encodeURIComponent(mensajeWhatsApp)}">

💬 Consultar por WhatsApp

</a>

</div>

</div>

`;

});

}

document.getElementById("buscar").addEventListener("input",e=>{

const texto=e.target.value.toLowerCase().trim();

mostrar(

perfumes.filter(p=>

(p.perfume || "").toLowerCase().includes(texto)

)

);

});

</script>

</body>

</html>
