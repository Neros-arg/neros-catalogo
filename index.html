<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NERÓS - Catálogo Oficial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d0d0d;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    padding:30px;
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:35px;
}

.logo{
    width:240px;
    max-width:90%;
    margin:auto;
    display:block;
}

.subtitulo{
    margin-top:10px;
    color:#d4af37;
    font-size:13px;
    letter-spacing:4px;
    font-weight:bold;
}

/* BUSCADOR */

input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:17px;
    margin-bottom:35px;
    outline:none;
}

/* PRODUCTOS */

#productos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:22px;
}

/* TARJETA */

.card{
    background:#1b1b1b;
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
    box-shadow:0 0 18px rgba(0,0,0,.45);
}

.card:hover{
    transform:translateY(-6px);
}

.card img{
    width:100%;
    height:280px;
    object-fit:cover;
    background:#222;
}

.info{
    padding:18px;
}

.nombre{
    font-size:18px;
    font-weight:bold;
    min-height:48px;
}

.precio{
    margin-top:12px;
    font-size:28px;
    color:#ffcc66;
    font-weight:bold;
}

.stock{
    margin-top:12px;
    font-size:15px;
    opacity:.9;
}

/* BOTON */

.whatsapp{
    display:block;
    margin-top:18px;
    background:#25D366;
    color:white;
    text-align:center;
    text-decoration:none;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
    transition:.2s;
}

.whatsapp:hover{
    background:#1ebe5d;
}

</style>

</head>

<body>

<div class="header">

<img src="logo%20neros.png" class="logo" alt="NERÓS">

<div class="subtitulo">
CATÁLOGO OFICIAL
</div>

</div>

<input
id="buscar"
placeholder="🔍 Buscar perfume...">

<div id="productos"></div>

<script>

const API="https://script.google.com/macros/s/AKfycbwuMOgpsxiDOrk14N85W25JCYiRmQJQRV5bz3i6YNSSQK72yQ5TU0hCIZIpUxCQvbeneg/exec";

let perfumes=[];

fetch(API)
.then(r=>r.json())
.then(data=>{

    perfumes=data;

    mostrar(data);

});

function mostrar(lista){

const cont=document.getElementById("productos");

cont.innerHTML="";

lista.forEach(p=>{

cont.innerHTML+=`

<div class="card">

<img src="${p.foto || 'https://placehold.co/400x500?text=NEROS'}">

<div class="info">

<div class="nombre">

${p.perfume}

</div>

<div class="precio">

$ ${Number(p.precio).toLocaleString("es-AR")}

</div>

<div class="stock">

${p.stock}

</div>

<a
class="whatsapp"
target="_blank"
href="https://wa.me/5493410000000?text=Hola%20quiero%20consultar%20por%20${encodeURIComponent(p.perfume)}">

Consultar por WhatsApp

</a>

</div>

</div>

`;

});

}

document.getElementById("buscar").addEventListener("keyup",e=>{

const texto=e.target.value.toLowerCase();

mostrar(

perfumes.filter(p=>

p.perfume.toLowerCase().includes(texto)

)

);

});

</script>

</body>

</html>
