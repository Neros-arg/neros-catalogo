<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NERÓS | Catálogo Oficial</title>
<link rel="icon" type="image/png" href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
    background:
        linear-gradient(rgba(8,8,8,.82), rgba(8,8,8,.82)),
        url("fondo.png");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

    color:white;

    padding:30px;
}

.header{

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
margin-bottom:35px;

}

.logo{

width:180px;
height:auto;
display:block;

}

.subtitulo{

margin-top:10px;
color:#c89d38;
font-size:13px;
letter-spacing:4px;
font-weight:bold;
text-transform:uppercase;

}

input{

width:100%;
max-width:700px;
margin:0 auto 35px;
display:block;
padding:16px;
background:#181818;
color:white;
border:1px solid #333;
border-radius:12px;
font-size:16px;
outline:none;

}

input:focus{

border-color:#c89d38;

}

#productos{

display:grid;
grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
gap:24px;

}

.card{

background:#171717;
border-radius:18px;
overflow:hidden;
border:1px solid #262626;
transition:.25s;

}

.card:hover{

transform:translateY(-6px);
border-color:#c89d38;

}

.card img{

width:100%;
height:340px;
object-fit:cover;
background:#222;

}

.info{

padding:18px;

}

.nombre{

font-size:18px;
font-weight:bold;
line-height:1.4;
min-height:55px;

}

.precio{

margin-top:14px;
font-size:30px;
font-weight:bold;
color:#ffcc66;

}

.stock{

margin-top:14px;
font-size:15px;
font-weight:bold;

}

.stock.disponible{

color:#3ddc84;

}

.stock.apedido{

color:#f5c542;

}

.stock.sinstock{

color:#ff5a5a;

}

.whatsapp{

display:block;
margin-top:18px;
padding:14px;
background:#25D366;
border-radius:10px;
text-align:center;
text-decoration:none;
color:white;
font-weight:bold;
transition:.2s;

}

.whatsapp:hover{

background:#1fb85a;

}

@media(max-width:1400px){

#productos{
grid-template-columns:repeat(5,minmax(0,1fr));
}

}

@media(max-width:1100px){

#productos{
grid-template-columns:repeat(4,minmax(0,1fr));
}

}

@media(max-width:850px){

#productos{
grid-template-columns:repeat(3,minmax(0,1fr));
gap:14px;
}

}

@media(max-width:600px){

body{
padding:10px;
}

.logo{
width:145px;
}

input{
margin-bottom:22px;
padding:13px;
}

#productos{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.card{
border-radius:12px;
}

.card img{
height:190px;
}

.info{
padding:10px;
}

.nombre{
font-size:13px;
line-height:1.3;
min-height:50px;
}

.precio{
margin-top:8px;
font-size:20px;
}

.stock{
margin-top:8px;
font-size:12px;
}

.whatsapp{
margin-top:10px;
padding:10px 5px;
font-size:12px;
}

}

@media(max-width:360px){

.card img{
height:165px;
}

.nombre{
font-size:12px;
}

.precio{
font-size:18px;
}

}

}

</style>

</head>

<body>

<div class="header">

<img src="logo%20neros.png" class="logo">

<div class="subtitulo">

CATÁLOGO OFICIAL

</div>

</div>

<input
id="buscar"
placeholder="🔍 Buscar perfume...">

<div id="productos"></div>

<script>

const API="https://script.google.com/macros/s/AKfycbwuMOgpsxiDOrk14N85W25JCYiRmQJQRV5bz3i6YNSSQK72yQ5TU0hCIZIpUxCQvbeneg/exec";

let perfumes=[];

fetch(API)

.then(r=>r.json())

.then(data=>{

perfumes=data;

mostrar(data);

});

function mostrar(lista){

const cont=document.getElementById("productos");

cont.innerHTML="";

lista.forEach(p=>{

let claseStock="";

let textoStock=(p.stock || "").toString().toLowerCase();

if(textoStock.includes("disponible")){

claseStock="disponible";

}else if(textoStock.includes("pedido")){

claseStock="apedido";

}else{

claseStock="sinstock";

}

const precioLista=Number(p.precio) || 0;

const precioEfectivo=precioLista*0.90;

const precioListaFormateado=precioLista.toLocaleString("es-AR",{
minimumFractionDigits:0,
maximumFractionDigits:0
});

const precioEfectivoFormateado=precioEfectivo.toLocaleString("es-AR",{
minimumFractionDigits:0,
maximumFractionDigits:0
});

const mensajeWhatsApp=`Hola NERÓS 👋✨

Quiero consultar por este perfume:

🧴 ${p.perfume}

💳 Precio de lista: $${precioListaFormateado}

💵 Efectivo o transferencia:
$${precioEfectivoFormateado}

🏷️ 10% de descuento

📦 Estado: ${p.stock}

¿Me confirmás disponibilidad? Muchas gracias 🙌`;

cont.innerHTML+=`

<div class="card">

<img src="${p.foto || 'https://placehold.co/600x800/222222/888888?text=NERÓS'}">

<div class="info">

<div class="nombre">

${p.perfume}

</div>

<div class="precio">

$ ${precioListaFormateado}

</div>

<div class="stock ${claseStock}">

${p.stock}

</div>

<a
class="whatsapp"
target="_blank"
href="https://wa.me/5493417830300?text=${encodeURIComponent(mensajeWhatsApp)}">

💬 Consultar por WhatsApp

</a>

</div>

</div>

`;

});

}

document.getElementById("buscar").addEventListener("keyup",e=>{

const texto=e.target.value.toLowerCase();

mostrar(

perfumes.filter(p=>

(p.perfume || "").toLowerCase().includes(texto)

)

);

});

</script>

</body>

</html>
